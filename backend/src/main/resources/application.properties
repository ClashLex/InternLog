# InternLog backend — MySQL primary. Override with env vars on hosted platforms.
# Local: docker compose up -d mysql  →  jdbc:mysql://localhost:3306/internlog
# Hosted: set DB_URL / DB_USER / DB_PASS, admin credentials, and secure cookie settings.

spring.application.name=internlog-backend
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# --- Database (env-overridable; defaults = local docker-compose) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/internlog?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:internlog}
spring.datasource.password=${DB_PASS:internlog}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- CORS: comma-separated origins allowed to call /api/** ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080,https://clashlex.github.io}

# --- API bearer tokens and administrator credentials ---
# An empty JWT_SECRET generates an ephemeral key; the browser uses Java-held sessions.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiry-ms=86400000
app.admin.email=${ADMIN_EMAIL:}
app.admin.password-hash=${ADMIN_PASSWORD_HASH:}

server.port=${PORT:8080}
# Eight-hour inactivity timeout. HTTPS deployments must enable secure cookies.
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# API docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
