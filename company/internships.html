<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internships — InternLog</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2342613c'/><text x='16' y='22' font-family='system-ui,sans-serif' font-weight='800' font-size='16' fill='white' text-anchor='middle'>IL</text></svg>">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/accessibility.js" defer></script>
  <script src="../js/script.js" defer></script>
  <script src="../js/api.js" defer></script>
</head>
<body>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="app-layout" id="companyLayout">
    <aside class="sidebar" id="sidebar" aria-label="Company navigation">
      <a class="brand" href="../index.html"><span class="brand-mark">IL</span><span>InternLog</span></a>
      <nav id="companyNav"><a href="dashboard.html">Dashboard</a><a class="active" href="internships.html">Internships</a><a href="add-internship.html">Post Internship</a><a href="applicants.html">Applicants</a><a href="profile.html">Company Profile</a></nav>
      <div class="side-foot"><nav><a href="../index.html" data-logout>Logout</a></nav></div>
    </aside>
    <div class="main">
      <header class="topbar"><button class="menu-btn" id="menuBtn" aria-label="Toggle navigation">☰</button><h1 id="pageTitle">Internships</h1><div class="spacer"></div><div class="user-chip" id="companyChip"><span class="avatar" id="avatar">C</span><span><strong id="companyName"></strong><br><span class="muted" id="companyEmail"></span></span></div></header>
      <main class="content">
        <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap"><div><h2 id="heading" style="margin:0 0 6px">Your Internships</h2><p class="muted" id="subheading" style="margin:0">Manage the opportunities your company has posted.</p></div><a class="btn btn-sm" id="postButton" href="add-internship.html">+ Post Internship</a></div>
        <div class="toolbar"><input class="search-input" type="search" id="search" placeholder="Search internships, skills, or locations" aria-label="Search internships"><select id="statusFilter"><option value="all">All statuses</option><option value="Published">Published</option><option value="Pending Review">Pending Review</option><option value="Draft">Draft</option><option value="Rejected">Rejected</option><option value="Expired">Expired</option><option value="Suspended">Suspended</option><option value="Archived">Archived</option></select></div>
        <div id="cards" class="grid-2"></div>
      </main>
    </div>
  </div>
  <div class="modal-backdrop" id="jobModal" role="dialog" aria-modal="true" aria-label="Internship details"><div class="modal"><div class="modal-header"><h3 id="modalTitle">Internship</h3><button class="modal-close-icon" id="closeModal" aria-label="Close dialog">&times;</button></div><div id="modalBody"></div></div></div>
  <script>
    (function(){
      "use strict";
      function esc(s){return String(s==null?"":s).replace(/[&<>\"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
      function fmtDate(v){if(!v)return"—";var p=String(v).split("-");return p.length===3?new Date(Number(p[0]),Number(p[1])-1,Number(p[2])).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}):esc(v);}
      function badge(v){var s=v||"Draft";var cls=s==="Published"?"badge-selected":(s==="Pending Review"||s==="Pending")?"badge-shortlisted":s==="Draft"?"badge-applied":"badge-disabled";return'<span class="badge '+cls+'">'+esc(s)+'</span>';}
      var company = null, jobs = [];
      function currentCompany(){return company;}
      function openModal(job){
        var modal=document.getElementById("jobModal"), body=document.getElementById("modalBody");
        document.getElementById("modalTitle").textContent=job.title||"Internship";
        var skills=(job.skills||[]).map(esc).join(", ")||"Not specified";
        var stipend=job.stipend?"₹"+Number(job.stipend).toLocaleString("en-IN")+" / month":"Unpaid / not specified";
        body.innerHTML='<dl><dt>Company</dt><dd>'+esc(job.company)+'</dd><dt>Location</dt><dd>'+esc(job.location)+'</dd><dt>Type</dt><dd>'+esc(job.internshipType)+'</dd><dt>Stipend</dt><dd>'+esc(stipend)+'</dd><dt>Positions</dt><dd>'+esc(job.positions||1)+'</dd><dt>Deadline</dt><dd>'+fmtDate(job.deadline)+'</dd><dt>Skills</dt><dd>'+skills+'</dd></dl><p>'+esc(job.description)+'</p>'+(job.education?'<p style="margin-top:10px"><strong>Preferred education:</strong> '+esc(job.education)+'</p>':'')+'<div class="modal-footer" style="margin-top:20px"><button class="btn btn-secondary btn-sm" id="editJob">Edit</button><button class="btn btn-danger btn-sm" id="archiveJob">'+(job.status==="Archived"?"Publish":"Archive")+'</button></div>';
        modal.classList.add("open");
        document.getElementById("editJob").onclick=function(){window.location.href="add-internship.html?edit="+encodeURIComponent(job.id);};
        document.getElementById("archiveJob").onclick=async function(){
          var button=this; button.disabled=true;
          try {
            await window.InternLog.setInternshipStatus(job.id,job.status==="Archived"?"Pending Review":"Archived");
            jobs=await window.InternLog.getInternshipsByCompany(company.id);
            modal.classList.remove("open");render();
            window.InternLog.showNotification(job.status==="Archived"?"Internship resubmitted for admin review.":"Internship archived.","success");
          } catch(error) { window.InternLog.showNotification(error.message,"error"); }
          finally { button.disabled=false; }
        };
      }
      function render(){
        var company=currentCompany();if(!company)return;
        var all=jobs.slice();
        var query=document.getElementById("search").value.trim().toLowerCase(), filter=document.getElementById("statusFilter").value;
        if(filter!=="all")all=all.filter(function(j){return j.status===filter;});
        if(query)all=all.filter(function(j){return [j.title,j.company,j.location,j.description,(j.skills||[]).join(" ")].join(" ").toLowerCase().indexOf(query)!==-1;});
        var wrap=document.getElementById("cards");
        if(!all.length){wrap.innerHTML='<div class="empty" style="grid-column:1/-1"><h3>No matching internships</h3><p>Post an internship or change your filters to see your opportunities.</p></div>';return;}
        wrap.innerHTML=all.sort(function(a,b){return String(b.createdAt).localeCompare(String(a.createdAt));}).map(function(j){
          var stipend=j.stipend?"₹"+Number(j.stipend).toLocaleString("en-IN")+"/mo":"Stipend not specified";
          return'<article class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><h3>'+esc(j.title)+'</h3><p>'+esc(j.company)+' · '+esc(j.location)+'</p></div>'+badge(j.status)+'</div><p style="margin-top:10px">'+esc((j.description||"").length>170?(j.description||"").slice(0,167)+"…":(j.description||""))+'</p><div class="mini-row" style="margin-top:10px"><span>'+esc(stipend)+' · '+esc(j.internshipType)+'</span><span>Deadline '+fmtDate(j.deadline)+'</span></div><div class="actions" style="margin-top:10px"><button class="btn btn-sm" data-view="'+j.id+'">View</button></div></article>';
        }).join("");
        wrap.querySelectorAll("[data-view]").forEach(function(btn){btn.addEventListener("click",function(){var j=all.find(function(x){return String(x.id)===String(btn.getAttribute("data-view"));});if(j)openModal(j);});});
      }
      document.addEventListener("DOMContentLoaded",async function(){
        if(!await window.InternLog.ready)return;
        var session=window.InternLog.getSession();
        if(!session||session.role!=="company"){window.location.href="login.html";return;}
        company=await window.InternLog.getCompanyById(session.userId);
        if(!company){window.location.href="../user/internships.html";return;}
        jobs=await window.InternLog.getInternshipsByCompany(company.id);
        document.getElementById("companyName").textContent=company.name;
        document.getElementById("companyEmail").textContent=company.email;
        document.getElementById("avatar").textContent=((company.name||"C").trim().charAt(0)||"C").toUpperCase();
        document.getElementById("search").addEventListener("input",render);
        document.getElementById("statusFilter").addEventListener("change",render);
        document.getElementById("closeModal").addEventListener("click",function(){document.getElementById("jobModal").classList.remove("open");});
        document.getElementById("jobModal").addEventListener("click",function(e){if(e.target===this)this.classList.remove("open");});
        render();
      });
    }());
  </script>
</body>
</html>
