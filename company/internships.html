<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internships — InternLog</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232563eb'/><text x='16' y='22' font-family='system-ui,sans-serif' font-weight='800' font-size='16' fill='white' text-anchor='middle'>IL</text></svg>">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/script.js" defer></script>
</head>
<body>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="app-layout" id="companyLayout">
    <aside class="sidebar" id="sidebar" aria-label="Internship navigation">
      <a class="brand" href="../index.html"><span class="brand-mark">IL</span><span>InternLog</span></a>
      <nav id="companyNav"><a href="dashboard.html">Dashboard</a><a class="active" href="internships.html">Internships</a><a href="add-internship.html">Post Internship</a><a href="applicants.html">Applicants</a><a href="profile.html">Company Profile</a></nav>
      <div class="side-foot"><nav><a href="../index.html" data-logout>Logout</a></nav></div>
    </aside>
    <div class="main">
      <header class="topbar"><button class="menu-btn" id="menuBtn" aria-label="Toggle navigation">☰</button><h1 id="pageTitle">Internships</h1><div class="spacer"></div><div class="user-chip" id="companyChip"><span class="avatar" id="avatar">C</span><span><strong id="companyName"></strong><br><span class="muted" id="companyEmail"></span></span></div></header>
      <main class="content">
        <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap"><div><h2 id="heading" style="margin:0 0 6px">Your Internships</h2><p class="muted" id="subheading" style="margin:0">Manage the opportunities your company has posted.</p></div><a class="btn btn-sm" id="postButton" href="add-internship.html">+ Post Internship</a></div>
        <div class="toolbar"><input class="search-input" type="search" id="search" placeholder="Search internships, skills, or locations" aria-label="Search internships"><select id="statusFilter"><option value="all">All statuses</option><option value="Published">Published</option><option value="Draft">Draft</option><option value="Archived">Archived</option></select></div>
        <div id="cards" class="grid-2"></div>
      </main>
    </div>
  </div>
  <div class="modal-backdrop" id="jobModal" role="dialog" aria-modal="true" aria-label="Internship details"><div class="modal"><div class="modal-header"><h3 id="modalTitle">Internship</h3><button class="modal-close-icon" id="closeModal" aria-label="Close dialog">&times;</button></div><div id="modalBody"></div></div></div>
  <script>
    (function(){
      "use strict";
      var SESSION="internlog_session", COMPANY="internlog_companies", JOBS="internlog_internships", APPS="internlog_applications", SAVED="internlog_saved_internships";
      function read(k,f){try{var v=JSON.parse(localStorage.getItem(k));return v==null?f:v;}catch(e){return f;}}
      function write(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
      function esc(s){return String(s==null?"":s).replace(/[&<>\"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
      function fmtDate(v){if(!v)return"—";var p=v.split("-");return p.length===3?new Date(Number(p[0]),Number(p[1])-1,Number(p[2])).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}):esc(v);}
      function badge(v){var cls=v==="Published"?"badge-selected":v==="Draft"?"badge-shortlisted":v==="Archived"?"badge-disabled":"badge-applied";return'<span class="badge '+cls+'">'+esc(v)+'</span>';}
      function currentCompany(){var s=read(SESSION,null);if(!s||s.role!=="company")return null;return read(COMPANY,[]).find(function(c){return String(c.id)===String(s.userId);})||null;}
      function publicMode(){var s=read(SESSION,null);return !s||s.role!=="company";}
      function openModal(job,mode){var modal=document.getElementById("jobModal"), body=document.getElementById("modalBody");document.getElementById("modalTitle").textContent=job.title;var skills=(job.skills||[]).map(esc).join(", ")||"Not specified";var stipend=job.stipend?"₹"+Number(job.stipend).toLocaleString("en-IN")+" / month":"Unpaid / not specified";body.innerHTML='<dl><dt>Company</dt><dd>'+esc(job.company)+'</dd><dt>Location</dt><dd>'+esc(job.location)+'</dd><dt>Type</dt><dd>'+esc(job.internshipType)+'</dd><dt>Stipend</dt><dd>'+esc(stipend)+'</dd><dt>Positions</dt><dd>'+esc(job.positions||1)+'</dd><dt>Deadline</dt><dd>'+fmtDate(job.deadline)+'</dd><dt>Skills</dt><dd>'+skills+'</dd></dl><p>'+esc(job.description)+'</p>'+(job.education?'<p style="margin-top:10px"><strong>Preferred education:</strong> '+esc(job.education)+'</p>':'')+(mode==="public"?'<div class="modal-footer" style="margin-top:20px"><button class="btn btn-secondary btn-sm" id="saveJob">Save</button><button class="btn btn-sm" id="applyJob">Apply</button></div>':'<div class="modal-footer" style="margin-top:20px"><button class="btn btn-secondary btn-sm" id="editJob">Edit</button><button class="btn btn-danger btn-sm" id="archiveJob">'+(job.status==="Archived"?"Publish":"Archive")+'</button></div>');modal.classList.add("open");
        if(mode==="public"){document.getElementById("saveJob").onclick=function(){var s=read(SESSION,null);if(!s||s.role!=="user"){if(window.InternLog)window.InternLog.showNotification("Log in as a student to save this internship.","info");window.location.href="../user/login.html";return;}var saved=read(SAVED,[]);if(saved.indexOf(job.id)===-1){saved.push(job.id);write(SAVED,saved);if(window.InternLog)window.InternLog.showNotification("Internship saved.","success");}else if(window.InternLog)window.InternLog.showNotification("Already saved.","info");};document.getElementById("applyJob").onclick=function(){var s=read(SESSION,null);if(!s||s.role!=="user"){window.location.href="../user/login.html";return;}var users=read("internlog_users",[]), user=users.find(function(u){return String(u.id)===String(s.userId);});var apps=read(APPS,[]);if(apps.some(function(a){return String(a.userId)===String(s.userId)&&String(a.internshipId)===String(job.id);})){if(window.InternLog)window.InternLog.showNotification("You already applied to this internship.","info");return;}var id=apps.reduce(function(m,a){return Math.max(m,Number(a.id)||0);},0)+1;apps.push({id:id,userId:s.userId,internshipId:job.id,companyId:job.companyId,company:job.company,role:job.title,location:job.location,internshipType:job.internshipType,appliedDate:new Date().toISOString().slice(0,10),deadline:job.deadline,stipend:job.stipend,status:"Applied",url:job.applyUrl||"",notes:"Applied from the InternLog opportunity board.",studentName:user?user.name:s.name,studentEmail:user?user.email:s.email});write(APPS,apps);if(job.applyUrl){window.open(job.applyUrl,"_blank","noopener");}document.getElementById("jobModal").classList.remove("open");if(window.InternLog)window.InternLog.showNotification("Application recorded.","success");};}
        else {document.getElementById("editJob").onclick=function(){window.location.href="add-internship.html?edit="+encodeURIComponent(job.id);};document.getElementById("archiveJob").onclick=function(){var all=read(JOBS,[]);var i=all.findIndex(function(j){return String(j.id)===String(job.id);});if(i<0)return;all[i].status=job.status==="Archived"?"Published":"Archived";all[i].updatedAt=new Date().toISOString();write(JOBS,all);modal.classList.remove("open");render();if(window.InternLog)window.InternLog.showNotification("Internship status updated.","success");};}
      }
      function render(){var pub=publicMode(), company=currentCompany(), all=read(JOBS,[]).filter(function(j){return pub?j.status==="Published":String(j.companyId)===String(company.id);}), query=document.getElementById("search").value.trim().toLowerCase(), filter=document.getElementById("statusFilter").value;if(!pub&&filter!=="all")all=all.filter(function(j){return j.status===filter;});if(query)all=all.filter(function(j){return [j.title,j.company,j.location,j.description,(j.skills||[]).join(" ")].join(" ").toLowerCase().indexOf(query)!==-1;});var wrap=document.getElementById("cards");if(!all.length){wrap.innerHTML='<div class="empty" style="grid-column:1/-1"><h3>'+ (pub?"No published opportunities yet":"No matching internships") +'</h3><p>'+ (pub?"Company opportunities will appear here once they are published.":"Post an internship or change your filters to see your opportunities.") +'</p></div>';return;}wrap.innerHTML=all.sort(function(a,b){return String(b.createdAt).localeCompare(String(a.createdAt));}).map(function(j){var stipend=j.stipend?"₹"+Number(j.stipend).toLocaleString("en-IN")+"/mo":"Stipend not specified";return'<article class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><h3>'+esc(j.title)+'</h3><p>'+esc(j.company)+' · '+esc(j.location)+'</p></div>'+badge(j.status)+'</div><p style="margin-top:10px">'+esc(j.description.length>170?j.description.slice(0,167)+"…":j.description)+'</p><div class="mini-row" style="margin-top:10px"><span>'+esc(stipend)+' · '+esc(j.internshipType)+'</span><span>Deadline '+fmtDate(j.deadline)+'</span></div><div class="actions" style="margin-top:10px"><button class="btn btn-sm" data-view="'+j.id+'">View</button></div></article>';}).join("");wrap.querySelectorAll("[data-view]").forEach(function(btn){btn.addEventListener("click",function(){var j=all.find(function(x){return String(x.id)===String(btn.getAttribute("data-view"));});if(j)openModal(j,pub?"public":"company");});});}
      document.addEventListener("DOMContentLoaded",function(){var company=currentCompany(), pub=publicMode();if(!pub&&!company){window.location.href="login.html";return;}if(pub){document.getElementById("pageTitle").textContent="Internship Opportunities";document.getElementById("heading").textContent="Discover Internships";document.getElementById("subheading").textContent="Browse public opportunities posted by companies on the prototype.";document.getElementById("postButton").style.display="none";document.getElementById("companyChip").innerHTML='<span class="muted">Student view</span>';document.getElementById("companyNav").innerHTML='<a class="active" href="internships.html">Opportunities</a><a href="../user/dashboard.html">Student Dashboard</a>';document.querySelector("[data-logout]").textContent="Back to Home";document.querySelector("[data-logout]").removeAttribute("data-logout");}else{document.getElementById("companyName").textContent=company.name;document.getElementById("companyEmail").textContent=company.email;document.getElementById("avatar").textContent=company.name.charAt(0).toUpperCase();document.querySelector("[data-logout]").addEventListener("click",function(e){e.preventDefault();localStorage.removeItem(SESSION);window.location.href="../index.html";});}document.getElementById("search").addEventListener("input",render);document.getElementById("statusFilter").addEventListener("change",render);document.getElementById("closeModal").addEventListener("click",function(){document.getElementById("jobModal").classList.remove("open");});document.getElementById("jobModal").addEventListener("click",function(e){if(e.target===this)this.classList.remove("open");});render();});
    }());
  </script>
</body>
</html>
