<body>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar" aria-label="Company navigation">
      <a class="brand" href="../index.html"><span class="brand-mark">IL</span><span>InternLog</span></a>
      <nav><a href="dashboard.html">Dashboard</a><a href="internships.html">Internships</a><a href="add-internship.html">Post Internship</a><a class="active" href="applicants.html">Applicants</a><a href="profile.html">Company Profile</a></nav>
