name: Verify and package Java application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: python scripts/check_frontend.py
      - run: node --test tests/frontend.test.js
      - run: bash mvnw -B -ntp package
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with:
          name: internlog-java-app
          path: backend/target/internlog-backend-1.0.0.jar
